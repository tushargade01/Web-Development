<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Grid System</title>
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col">
                Column
            </div>
        </div>
    </div>

    <hr>

    <!--single column take full width-->
    <div class="container">
        <div class="row">
            <div class="col bg-primary text-white p-3"> One Column</div>
        </div>
    </div>

    <hr>

    <!--two equal columns-->
    <div class="container">
        <div class="row">
            <div class="col bg-primary text-white p-3">Left</div>
            <div class="col bg-success text-white p-3">Right</div>
        </div>
    </div>
    <hr>

    <!-- Three Equal Columns -->
    <div class="container">
        <div class="row">
            <div class="col bg-danger">1</div>
            <div class="col bg-warning">2</div>
            <div class="col bg-info">3</div>
        </div>
    </div>
    <hr>

    <!-- Using specific column size -->

    <div class="row">
        <div class="col-8 bg-primary text-white">Main content</div>
        <div class="col-4 bg-success text-white">sidebar</div>
    </div>
    <hr>

    <!-- 50% + 50% -->
    <div class="row">
        <div class="col-6 bg-primary">left</div>
        <div class="col-6 bg-info">right</div>
    </div>
    <hr>

    <!-- 33% + 33% + 33% -->
    <div class="row">
        <div class="col-4 bg-danger">A</div>
        <div class="col-4 bg-warning">B</div>
        <div class="col-4 bg-success">C</div>
    </div>
    <hr>

    <!-- 25% + 25% + 25% + 25% -->
    <div class="row">
        <div class="col-3 bg-success">1</div>
        <div class="col-3 bg-dark">2</div>
        <div class="col-3 bg-info">3</div>
        <div class="col-3 bg-warning">4</div>
    </div>
    <hr>
    <hr>

    <!-- Responsive Grid -->

    <div class="container">
        <div class="row">
            <div class="col-md-6 bg-primary text-white p-3">Left</div>
            <div class="col-md-6 bg-success text-white p-3">Right</div>
        </div>
    </div>
    <hr>

    <!-- three responsive columns -->
    <div class="row">
        <div class="col-lg-4 bg-primary">One</div>
        <div class="col-lg-4 bg-success">Two</div>
        <div class="col-lg-4 bg-danger">Three</div>
    </div>
    <hr>

    <!--Mixing Column Sizes-->
    <div class="row">
        <div class="col-3 bg-primary">25%</div>
        <div class="col-9 bg-success">75%</div>
    </div>
    <hr>

    <!-- Auto Columns -->

    <div class="row">
        <div class="col bg-danger">A</div>
        <div class="col bg-light">B</div>
        <div class="col bg-info">C</div>
    </div>
    <hr>
    <hr>

    <!-- Project -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="bg-success text-white p-4">
                    Product 1
                </div>
            </div>
            <div class="col-md-4">
                <div class="bg-primary text-white p-4">
                    Product 2
                </div>
            </div>
            <div class="col-md-4">
                <div class="bg-danger text-white p-4">
                    Product 3
                </div>
            </div>
        </div>
    </div>
    <hr>

    <!-- Practice Exercise -->
    <!--
Two equal columns:

Left (blue)
Right (green)
-->
    <div class="row mt-4">
        <div class="col-6 bg-primary">Left</div>
        <div class="col-6 bg-success">Right</div>
    </div>
    <hr>

<!-- Three equal columns:
Red
Yellow
Blue  -->

    <div class="row">
        <div class="col-4 bg-danger">Red</div>
        <div class="col-4 bg-warning">Yellow</div>
        <div class="col-4 bg-primary">Blue</div>
    </div>
    <hr>

<!--A page layout:
Main content: col-md-8
Sidebar: col-md-4-->

    <div class="row">
        <div class="col-md-8 bg-info">Main Conetent</div>
        <div class="col-md-4 bg-danger">Sidebar</div>
    </div>
    <hr>
<!--Four product boxes:
Use col-lg-3
They should display in one row on large screens and stack automatically on smaller screens.-->

    <div class="row">
        <div class="col-lg-3 bg-danger">A</div>
        <div class="col-lg-3 bg-warning">B</div>
        <div class="col-lg-3 bg-success">C</div>
        <div class="col-lg-3 bg-secondary">D</div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js
"></script>
</body>

</html>
