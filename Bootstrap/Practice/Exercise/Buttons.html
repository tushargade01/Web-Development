<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>
    <!-- The Basic Button -->
    <button class="btn">Click Me!</button>
    <hr>

    <!-- Button Colors -->
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-info">Info</button>
    <button class="btn btn-light">Light</button>
    <button class="btn btn-dark">Dark</button>
    <hr>

    <!-- Outline Buttons -->
    <button class="btn btn-outline-secondary">Secondary Outline</button>
    <button class="btn btn-outline-success">Success Outline</button>
    <button class="btn btn-outline-danger">Danger Outline</button>
    <hr>

    <!-- Button Sizes -->
    <button class="btn btn-primary btn-lg">Large Button</button>
    <button class="btn-secondary btn">normal button</button>
    <button class="btn btn-primary btn-sm">Small Button</button>
    <hr>

    <!-- Desabled Buttons -->
    <button class="btn btn-warning" disabled>Disabled</button>
    <a href="#" class="btn btn-danger disabled">Disabled Link</a>
    <hr>

    <!-- block-level buttons -->
    <button class="btn btn-success w-100">Full width button</button>

    <div class="container mt-5 bg-info p-5 w-50">
        <button class="btn btn-danger w-100">Book Now</button>
    </div>
    <hr>

    <!-- button group -->
    <div class="btn-group">
        <button class="btn btn-primary">Left</button>
        <button class="btn btn-danger">Middle</button>
        <button class="btn btn-warning">Right</button>
    </div>

    <div class="btn-group">
        <div class="btn btn-outline-primary">Day</div>
        <div class="btn btn-outline-primary">Week</div>
        <div class="btn btn-outline-primary">Month</div>
    </div>
    <hr>

    <!-- Active and Disabled States in Groups -->
    <div class="btn-group">
        <button class="btn btn-primary active">Active</button>
        <button class="btn btn-primary">Noraml</button>
        <button class="btn btn-primary">Normal</button>
        <button class="btn btn-primary" disabled>Not Available</button>
    </div>
    <hr>

    <!-- Buttons with icons -->
    <button class="btn btn-dark">
        <i class="bi bi-download"></i> Download
    </button>

    <button class="btn btn-danger">
        <i class="bi bi-trash-fill"></i> Delete
    </button>

    <button class="btn btn-primary">👋 Hello 👋</button>
    <hr>

    <!-- Button on links -->
    <a href="#" class="btn btn-info">Learn More</a>
    <a href="#" class="btn btn-success">Get Started</a>
    <hr>
    <hr style="border: 2px solid black;">

    <!-- Practice Exercises -->
    <!-- 
Create:

One primary button
One danger button
One outline-success button 
-->
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-outline-success">Outline-Success</button>
    <hr>

    <!-- Create a large button:

btn-lg
Background success
Text "Buy Now" -->
    <button class="btn btn-lg btn-success">Buy Now</button>
    <hr>


    <!-- Create a disabled button:

"Not Available"
Color: secondary
Attribute disabled -->
    <button class="btn btn-secondary" disabled>Not Available</button>
    <hr>


    <!-- Create a full-width button:

Color: danger
Text "Delete Account" -->

    <button class="btn btn-danger w-100">Delete Account</button>
    <hr>

    <!-- Create a button group with three outline buttons:

"Light" | "Standard" | "Pro" -->
    <div class="btn-group">
        <button class="btn btn-outline-danger">Light</button>
        <button class="btn btn-outline-danger">Standard</button>
        <button class="btn btn-outline-danger">Pro</button>
    </div>
    <hr>

    <!-- Combine buttons with spacing (e.g., mt-3, mb-3) to space them vertically. -->
    <div class="btn-group mt-3 mb-3">
        <button class="btn btn-outline-dark">Light</button>
        <button class="btn btn-outline-dark">Standard</button>
        <button class="btn btn-outline-dark">Pro</button>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
