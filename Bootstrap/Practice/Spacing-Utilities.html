<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacing Utilities</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <!-- Padding -->
    <div class="text-white bg-info">0 normal</div>
    <div class="text-white bg-success p-1">p-1</div>
    <div class="text-white bg-danger p-2">p-2</div>
    <div class="text-white bg-warning p-3">p-3</div>
    <div class="text-muted bg-secondary p-4">p-4</div>
    <div class="text-white bg-primary p-5">p-5</div>
    <hr>

    <!-- Margin -->
    <div class="text-white bg-info">0 normal</div>
    <div class="text-white bg-success m-1">p-1</div>
    <div class="text-white bg-danger m-2">p-2</div>
    <div class="text-white bg-warning m-3">p-3</div>
    <div class="text-muted bg-secondary m-4">p-4</div>
    <div class="text-white bg-primary m-5">p-5</div>
    <hr>

    <!-- Direction Classes -->
    <!-- t = top
b = bottom
s = start (left in left-to-right languages)
e = end (right in left-to-right languages)
x = left + right
y = top + bottom
-->
    <p>Normal text</p>
    <p class="ps-5">ps-5</p>
    <p class="mx-5 my-5 px-4 bg-danger">px-4</p>

    <!-- Auto margin -->
    <!-- w-50 → width is 50%.
mx-auto → automatic left and right margins center the box.-->
    <div class="bg-primary text-white w-25 m-auto text-center py-3">Centered Box</div>

    <!-- Combining Spacing Classes -->
    <div class="bg-danger text-white
            mt-5
            mb-3
            px-5
            py-3">
        Bootstrap
    </div>

    <!-- Card Example -->

    <div class="card p-4 mt-5 bg-info w-50 m-auto mb-5">
        <h3>Course</h3>
        <p>Bootsrap Masterclass</p>
        <button class="btn btn-primary">Buy</button>
    </div>

    <!-- Multiple Boxes -->
    <div class="container">
        <div class="bg-primary text-white p-3 mb-3">Box One</div>
        <div class="bg-success text-white p-3 mb-3">Box Two</div>
        <div class="bg-danger text-white p-3">Box Three</div>
    </div>
    <hr>
    <hr>

    <!-- Practice Questions -->
    <!-- Create three colored boxes with mb-3 between each one. -->
    <div class="container">
        <div class="text-white bg-warning mb-3">Box One</div>
        <div class="text-white bg-secondary mb-3">Box Two</div>
        <div class="text-white bg-danger mb-3">Box Three</div>
    </div>
    <hr>

    <!-- Create a blue box with:
    p-5
    White text -->

    <div class="bg-primary text-white p-5">p-5 with White text</div>
    <hr>

    <!-- Create a centered box using:

w-50
mx-auto
p-4 -->

    <div class="w-50 mx-auto p-4 bg-warning">THis is Box</div>

    <!-- Create a heading with:

mt-5
mb-4 -->
    <h1 class="display-6 mt-5 mb-4">Heading 1</h1>

    <!-- Create a button with extra horizontal and vertical padding:

px-5
py-3 -->
<button class="px-5 py-3 bg-info">Click Me!</button>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js
"></script>
</body>

</html>
