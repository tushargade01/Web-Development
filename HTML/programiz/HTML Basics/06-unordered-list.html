<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>

<body>
    <ul type="square">
        <li>
            Coffee
            <ol type="i">
                <li>Cappuccino</li>
                <li>Americano</li>
                <li>Espresso</li>
            </ol>
        </li>
        <li>
            Tea
            <ol>
                <li>Milk Tea</li>
                <li>Black Tea</li>
            </ol>
        </li>
        <li>Milk</li>
    </ul>
</body>

</html>
