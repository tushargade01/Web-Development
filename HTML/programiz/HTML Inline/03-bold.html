<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold</title>
</head>

<body>
    <b>This text is bold.</b>
    <br>
    <strong>This text is also bold.</strong>

    <!-- both are same.
     strong is a semantic tag.
     we can also use the CSS property font-weight to make the text bold. -->
</body>

</html>
