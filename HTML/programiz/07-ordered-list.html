<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered List</title>
</head>

<body>
    <ol type="A" start='4'>
        <li>Harry</li>
        <li>Ron</li>
        <li>Sam</li>
    </ol>

    <ol start="10" reversed>
        <li>Cat</li>
        <li>Dog</li>
        <li>Elephant</li>
        <li>Fish</li>
    </ol>

    <ol type="I">
        <li>
            Chapter 1
            <ol type="a" start="3">
                <li>Lesson 1</li>
                <li>Lesson 2</li>
            </ol>
        </li>
        <li>
            Chapter 2
            <ol type="a" reversed>
                <li>Lesson 1</li>
                <li>Lesson 2</li>
                <li>Lesson 3</li>
            </ol>
        </li>
        <li>
            Chapter 3
            <ol type="a">
                <li>Lesson 1</li>
            </ol>
        </li>
    </ol>
</body>

</html>
