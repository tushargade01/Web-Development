<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>
    <ul>
        <p>unordered list</p>
        <li>Apple</li>
        <li>Orange</li>
        <li>Mango</li>
    </ul>

    <ol type="A">
        <p>ordered list</p>
        <li>Ready</li>
        <li>Set</li>
        <li>Go</li>
    </ol>

    <dl>
        <p>Description list</p>
        <!-- dt for description title.
             dd for define description.
             represent data in name value pair.
           -->

        <dt>HTML</dt>
        <dd>Hyper-Text Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading StyleSheets</dd>
        <dt>JS</dt>
        <dd>Javascript</dd>
    </dl>
</body>

</html>
